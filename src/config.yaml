backend: "neural"             # "neural" 使用大模型（MusicGen），"dsp" 使用内置合成器

duration_seconds: 45          # 每首歌时长（秒）
sample_rate: 44100            # 输出采样率，44.1kHz
bit_depth: 32                 # 写入 32-bit float WAV，保证后期空间

neural:
  model_name: "facebook/musicgen-medium"    # MusicGen 模型名
  device: "cpu"                             # 默认 CPU，如有 GPU 可改 "cuda"
  guidance_scale: 3.0                       # 类似 CFG，越大越贴近提示词
  max_new_tokens: 1024                      # 生成 token 数，和时长相关（不必太精确）

# 风格与概率分布（加起来建议为 1.0）
styles:
  - id: "phonk"
    probability: 0.7
    prompt: >
      dark aggressive phonk beat, hard distorted 808 bass, sharp cowbells,
      Memphis rap atmosphere, vinyl hiss, groovy rhythm, nightclub energy,
      high quality production, wide stereo, detailed mix

  - id: "phonk_chill"
    probability: 0.15
    prompt: >
      chill phonk instrumental, dreamy pads, smooth 808, gentle cowbells,
      nostalgic Memphis vibe, warm tape saturation, relaxed tempo,
      high fidelity, wide stereo image

  - id: "trap"
    probability: 0.07
    prompt: >
      modern dark trap beat, punchy 808s, crisp hi hats with rolls,
      atmospheric pads, club ready mix, high resolution, clean transients

  - id: "dnb"
    probability: 0.05
    prompt: >
      liquid drum and bass, fast breakbeats, deep sub bass, lush pads,
      rolling groove, atmospheric reverb, detailed and clean mix,
      high fidelity

  - id: "synthwave"
    probability: 0.03
    prompt: >
      retro 80s synthwave, analog synths, warm bass, big gated drums,
      neon city at night, nostalgic but modern mix, high quality production

# 自动化与发布配置
publishing:
  artist_name: "Daily Phonk Bot"
  album_name: "Automated Daily Drops"
  # 用于生成封面的基础提示词前缀
  cover_prompt_prefix: "Album cover art, high quality, digital art, trending on artstation, "
  # 社交媒体推广模板
  social_templates:
    twitter: "🚨 New {style} drop is out! 🎧 Check out today's generated track. \n\n#dailyphonk #{style} #ai #music"
    youtube: "Daily Generated {style} Track - {date}\n\nGenerated by Daily Phonk Bot.\nStyle: {style}\nPrompt: {prompt}\n\n#phonk #music #daily"

stats:
  # 统计数据库的存放路径
  db_path: "/Users/wizout/op/daily-phonk/outputs/stats.db"

output:
  root_dir: "/Users/wizout/op/daily-phonk/outputs"
  filename_prefix: "daily_phonk"


